<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Yet Another Markdown Editor visual harness</title>
    <link rel="stylesheet" href="/media/editor-theme.css">
    <style>
      :root {
        --vscode-editor-background: #ffffff;
        --vscode-editor-foreground: #242424;
        --vscode-focusBorder: #7c3aed;
        --vscode-textLink-foreground: #0969da;
        --vscode-textCodeBlock-background: #f5f5f5;
        --vscode-errorForeground: #d1242f;
      }
    </style>
    <script>
      window.__editorMessages = [];
      window.acquireVsCodeApi = () => ({
        postMessage(message) {
          window.__editorMessages.push(message);
          if (message.type === 'ready') {
            const emojiDemo = new URLSearchParams(window.location.search).get('demo') === 'emoji';
            const markdown = emojiDemo
              ? '# Emoji autocomplete\n\n:smil\n\nType a colon and start writing a name. Use the arrow keys and Enter to choose—no native picker required.\n\n- Fast local matching\n- Mouse and keyboard navigation\n- Works on macOS, Windows, and Linux\n'
              : '# Yet Another Markdown Editor\n\nA calm **Markdown canvas** with *inline formatting*, `high-contrast code`, ~~revisions~~, and [useful links](https://example.com).\n\n## Write naturally\n\n- [x] Edit rendered Markdown in place\n- [x] Move, copy, duplicate, or delete blocks\n- [ ] Type :rocket: for emoji autocomplete\n\n> Plain Markdown stays the source of truth.\n\n| Feature | Status |\n| --- | --- |\n| Slash commands | Ready |\n| Keyboard shortcuts | Ready |\n\n```ts\nconst portable = true;\n```\n';
            setTimeout(() => window.postMessage({
              type: 'document',
              version: 1,
              text: markdown
            }, '*'), 0);
            if (emojiDemo) {
              setTimeout(() => {
                const editor = document.querySelector('.ProseMirror');
                const target = editor?.querySelector('p');
                if (!editor || !target) return;
                const range = document.createRange();
                range.selectNodeContents(target);
                range.collapse(false);
                const selection = window.getSelection();
                selection?.removeAllRanges();
                selection?.addRange(range);
                editor.dispatchEvent(new InputEvent('input', { bubbles: true, inputType: 'insertText' }));
              }, 800);
            }
          }
        }
      });
    </script>
  </head>
  <body>
    <div id="app"><div class="editor-loading">Loading Markdown editor…</div></div>
    <script src="/dist/webview.js"></script>
  </body>
</html>
